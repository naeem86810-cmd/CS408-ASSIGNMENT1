<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS-408 DevTools Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    .box { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>CS-408 Assignment 1: DevTools Demo</h1>
  <p>This page has two deliberate bugs used to practise debugging in Developer Tools.</p>

  <div class="box">
    <h2>Bug 1: wrong output</h2>
    <p>Price 10 + Tax 5 should be <strong>15</strong>. The page shows: <strong id="total"></strong></p>
  </div>

  <div class="box">
    <h2>Bug 2: failed image request</h2>
    <!-- The file images/logo.png does not exist, so the Network panel shows a 404 -->
    <img src="images/logo.png" alt="Logo (missing file)" width="120">
  </div>

  <script>
    // Bug: values read as strings, so + joins text instead of adding numbers ("10" + "5" = "105")
    const price = '10';
    const tax = '5';
    const total = price + tax;
    console.log('price:', price, 'tax:', tax, 'total:', total);
    document.getElementById('total').textContent = total;
  </script>
</body>
</html>
